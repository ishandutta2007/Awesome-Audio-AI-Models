<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="sub-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#d946ef" stop-opacity="0.25" />
    </linearGradient>

    <linearGradient id="wave-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="bar-grad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#e879f9" />
    </linearGradient>

    <linearGradient id="pill-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.3" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .font-sub {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
    }
    .font-pill {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.3px;
    }
  </style>

  <!-- Deep Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />

  <!-- Background Grid Pattern -->
  <g opacity="0.12">
    <path d="M 0 50 L 1200 50 M 0 100 L 1200 100 M 0 150 L 1200 150 M 0 200 L 1200 200 M 0 250 L 1200 250 M 0 300 L 1200 300 M 0 350 L 1200 350" stroke="#94a3b8" stroke-width="0.7" />
    <path d="M 100 0 L 100 400 M 200 0 L 200 400 M 300 0 L 300 400 M 400 0 L 400 400 M 500 0 L 500 400 M 600 0 L 600 400 M 700 0 L 700 400 M 800 0 L 800 400 M 900 0 L 900 400 M 1000 0 L 1000 400 M 1100 0 L 1100 400" stroke="#94a3b8" stroke-width="0.7" />
  </g>

  <!-- Pulsing Ambient Glow Spheres (Background) -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)">
    <animate attributeName="r" values="120;160;120" dur="7s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.08;0.18;0.08" dur="7s" repeatCount="indefinite" />
  </circle>

  <circle cx="1020" cy="320" r="160" fill="#a855f7" opacity="0.12" filter="url(#glow)">
    <animate attributeName="r" values="140;180;140" dur="9s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.09;0.2;0.09" dur="9s" repeatCount="indefinite" />
  </circle>

  <!-- Animated Sinusoidal Audio Waves (Background & Midground) -->
  <path fill="none" stroke="url(#wave-grad-1)" stroke-width="3" opacity="0.7">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="
        M -200 280 Q 50 200, 300 270 T 800 260 T 1400 270;
        M -200 270 Q 100 320, 350 250 T 850 300 T 1400 250;
        M -200 260 Q 80 230, 400 290 T 900 240 T 1400 280;
        M -200 280 Q 50 200, 300 270 T 800 260 T 1400 270
      " />
  </path>

  <path fill="none" stroke="url(#wave-grad-2)" stroke-width="2.5" opacity="0.5">
    <animate attributeName="d" dur="11s" repeatCount="indefinite"
      values="
        M -200 310 Q 150 360, 450 300 T 950 320 T 1400 290;
        M -200 290 Q 200 250, 500 330 T 1000 280 T 1400 320;
        M -200 320 Q 120 330, 480 270 T 920 340 T 1400 300;
        M -200 310 Q 150 360, 450 300 T 950 320 T 1400 290
      " />
  </path>

  <!-- Animated Audio Equalizer Spectrum Bars (Bottom/Center Decorative, subtle behind text) -->
  <g transform="translate(420, 350)" opacity="0.45">
    <!-- Bar 1 -->
    <rect x="0" y="-30" width="6" height="30" rx="3" fill="url(#bar-grad)">
      <animate attributeName="height" values="20;50;15;42;20" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="y" values="-20;-50;-15;-42;-20" dur="1.8s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 2 -->
    <rect x="14" y="-45" width="6" height="45" rx="3" fill="url(#bar-grad)">
      <animate attributeName="height" values="35;65;20;55;35" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="-35;-65;-20;-55;-35" dur="1.6s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 3 -->
    <rect x="28" y="-60" width="6" height="60" rx="3" fill="url(#bar-grad)">
      <animate attributeName="height" values="50;85;35;70;50" dur="2.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="-50;-85;-35;-70;-50" dur="2.1s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 4 -->
    <rect x="42" y="-35" width="6" height="35" rx="3" fill="url(#bar-grad)">
      <animate attributeName="height" values="25;70;40;60;25" dur="1.7s" repeatCount="indefinite" />
      <animate attributeName="y" values="-25;-70;-40;-60;-25" dur="1.7s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 5 -->
    <rect x="56" y="-70" width="6" height="70" rx="3" fill="url(#bar-grad)">
      <animate attributeName="height" values="60;90;45;80;60" dur="1.9s" repeatCount="indefinite" />
      <animate attributeName="y" values="-60;-90;-45;-80;-60" dur="1.9s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 6 -->
    <rect x="70" y="-40" width="6" height="40" rx="3" fill="url(#bar-grad)">
      <animate attributeName="height" values="30;60;25;50;30" dur="2.3s" repeatCount="indefinite" />
      <animate attributeName="y" values="-30;-60;-25;-50;-30" dur="2.3s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 7 -->
    <rect x="84" y="-55" width="6" height="55" rx="3" fill="url(#bar-grad)">
      <animate attributeName="height" values="45;75;30;65;45" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="-45;-75;-30;-65;-45" dur="1.5s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 8 -->
    <rect x="98" y="-75" width="6" height="75" rx="3" fill="url(#bar-grad)">
      <animate attributeName="height" values="65;95;40;80;65" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="-65;-95;-40;-80;-65" dur="2.2s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 9 -->
    <rect x="112" y="-30" width="6" height="30" rx="3" fill="url(#bar-grad)">
      <animate attributeName="height" values="25;55;20;45;25" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="y" values="-25;-55;-20;-45;-25" dur="1.8s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 10 -->
    <rect x="126" y="-60" width="6" height="60" rx="3" fill="url(#bar-grad)">
      <animate attributeName="height" values="40;80;35;75;40" dur="1.7s" repeatCount="indefinite" />
      <animate attributeName="y" values="-40;-80;-35;-75;-40" dur="1.7s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 11 -->
    <rect x="140" y="-80" width="6" height="80" rx="3" fill="url(#bar-grad)">
      <animate attributeName="height" values="70;98;50;85;70" dur="2.0s" repeatCount="indefinite" />
      <animate attributeName="y" values="-70;-98;-50;-85;-70" dur="2.0s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 12 -->
    <rect x="154" y="-45" width="6" height="45" rx="3" fill="url(#bar-grad)">
      <animate attributeName="height" values="35;65;25;55;35" dur="1.9s" repeatCount="indefinite" />
      <animate attributeName="y" values="-35;-65;-25;-55;-35" dur="1.9s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 13 -->
    <rect x="168" y="-70" width="6" height="70" rx="3" fill="url(#bar-grad)">
      <animate attributeName="height" values="55;88;40;75;55" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="-55;-88;-40;-75;-55" dur="1.6s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 14 -->
    <rect x="182" y="-35" width="6" height="35" rx="3" fill="url(#bar-grad)">
      <animate attributeName="height" values="20;50;15;40;20" dur="2.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="-20;-50;-15;-40;-20" dur="2.1s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 15 -->
    <rect x="196" y="-60" width="6" height="60" rx="3" fill="url(#bar-grad)">
      <animate attributeName="height" values="45;75;30;60;45" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="y" values="-45;-75;-30;-60;-45" dur="1.8s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 16 -->
    <rect x="210" y="-85" width="6" height="85" rx="3" fill="url(#bar-grad)">
      <animate attributeName="height" values="60;95;45;80;60" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="-60;-95;-45;-80;-60" dur="2.4s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 17 -->
    <rect x="224" y="-40" width="6" height="40" rx="3" fill="url(#bar-grad)">
      <animate attributeName="height" values="30;65;25;50;30" dur="1.7s" repeatCount="indefinite" />
      <animate attributeName="y" values="-30;-65;-25;-50;-30" dur="1.7s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 18 -->
    <rect x="238" y="-65" width="6" height="65" rx="3" fill="url(#bar-grad)">
      <animate attributeName="height" values="50;82;35;70;50" dur="1.9s" repeatCount="indefinite" />
      <animate attributeName="y" values="-50;-82;-35;-70;-50" dur="1.9s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 19 -->
    <rect x="252" y="-30" width="6" height="30" rx="3" fill="url(#bar-grad)">
      <animate attributeName="height" values="22;52;18;44;22" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="-22;-52;-18;-44;-22" dur="1.6s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 20 -->
    <rect x="266" y="-75" width="6" height="75" rx="3" fill="url(#bar-grad)">
      <animate attributeName="height" values="55;90;40;78;55" dur="2.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="-55;-90;-40;-78;-55" dur="2.1s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 21 -->
    <rect x="280" y="-45" width="6" height="45" rx="3" fill="url(#bar-grad)">
      <animate attributeName="height" values="32;62;20;50;32" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="y" values="-32;-62;-20;-50;-32" dur="1.8s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 22 -->
    <rect x="294" y="-60" width="6" height="60" rx="3" fill="url(#bar-grad)">
      <animate attributeName="height" values="42;72;30;64;42" dur="1.7s" repeatCount="indefinite" />
      <animate attributeName="y" values="-42;-72;-30;-64;-42" dur="1.7s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 23 -->
    <rect x="308" y="-85" width="6" height="85" rx="3" fill="url(#bar-grad)">
      <animate attributeName="height" values="65;95;45;85;65" dur="2.3s" repeatCount="indefinite" />
      <animate attributeName="y" values="-65;-95;-45;-85;-65" dur="2.3s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 24 -->
    <rect x="322" y="-40" width="6" height="40" rx="3" fill="url(#bar-grad)">
      <animate attributeName="height" values="28;58;18;48;28" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="y" values="-28;-58;-18;-48;-28" dur="1.5s" repeatCount="indefinite" />
    </rect>
    <!-- Bar 25 -->
    <rect x="336" y="-70" width="6" height="70" rx="3" fill="url(#bar-grad)">
      <animate attributeName="height" values="48;80;35;72;48" dur="2.0s" repeatCount="indefinite" />
      <animate attributeName="y" values="-48;-80;-35;-72;-48" dur="2.0s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- FOREGROUND CONTENT: Header Tag, Title, Subtitle, Badges -->
  <!-- Top Category Tag -->
  <g transform="translate(60, 68)">
    <rect x="0" y="0" width="220" height="30" rx="15" fill="#1e293b" stroke="url(#pill-border)" stroke-width="1.2" />
    <circle cx="16" cy="15" r="5" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="20" class="font-pill" fill="#38bdf8">AUDIO AI ECOSYSTEM</text>
  </g>

  <!-- Main Title with Gradient and High Contrast -->
  <text x="60" y="160" class="font-title" font-size="54" fill="url(#title-grad)" filter="url(#soft-glow)">
    Awesome Audio AI Models
  </text>
  <text x="60" y="160" class="font-title" font-size="54" fill="url(#title-grad)">
    Awesome Audio AI Models
  </text>

  <!-- Subtitle -->
  <text x="62" y="212" class="font-sub" font-size="21" fill="url(#sub-grad)">
    Curated Directory of Neural Text-to-Speech, Voice Cloning &amp; Generative Audio
  </text>

  <!-- Feature Pills / Highlights -->
  <g transform="translate(60, 275)">
    <!-- Pill 1: SaaS Platforms -->
    <g transform="translate(0, 0)">
      <rect width="180" height="42" rx="21" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.2" />
      <text x="24" y="26" class="font-pill" fill="#f1f5f9">☁️ SaaS Platforms</text>
    </g>

    <!-- Pill 2: Open Source SOTA -->
    <g transform="translate(196, 0)">
      <rect width="195" height="42" rx="21" fill="#1e293b" fill-opacity="0.85" stroke="#818cf8" stroke-width="1.2" />
      <text x="24" y="26" class="font-pill" fill="#f1f5f9">⚡ Open-Source SOTA</text>
    </g>

    <!-- Pill 3: Instant Voice Cloning -->
    <g transform="translate(407, 0)">
      <rect width="205" height="42" rx="21" fill="#1e293b" fill-opacity="0.85" stroke="#c084fc" stroke-width="1.2" />
      <text x="24" y="26" class="font-pill" fill="#f1f5f9">🎙️ Voice Cloning &amp; TTS</text>
    </g>

    <!-- Pill 4: Edge & Local Audio -->
    <g transform="translate(628, 0)">
      <rect width="195" height="42" rx="21" fill="#1e293b" fill-opacity="0.85" stroke="#34d399" stroke-width="1.2" />
      <text x="24" y="26" class="font-pill" fill="#f1f5f9">💻 Edge &amp; Offline AI</text>
    </g>
  </g>

  <!-- Modern Top-Right Soundwave Icon Accent -->
  <g transform="translate(1060, 55)" stroke="#818cf8" stroke-width="2.5" stroke-linecap="round" opacity="0.85">
    <line x1="0" y1="20" x2="0" y2="40">
      <animate attributeName="y1" values="20;5;20" dur="1.2s" repeatCount="indefinite" />
      <animate attributeName="y2" values="40;55;40" dur="1.2s" repeatCount="indefinite" />
    </line>
    <line x1="12" y1="12" x2="12" y2="48">
      <animate attributeName="y1" values="12;2;12" dur="1.5s" repeatCount="indefinite" />
      <animate attributeName="y2" values="48;58;48" dur="1.5s" repeatCount="indefinite" />
    </line>
    <line x1="24" y1="5" x2="24" y2="55">
      <animate attributeName="y1" values="5;15;5" dur="1.1s" repeatCount="indefinite" />
      <animate attributeName="y2" values="55;45;55" dur="1.1s" repeatCount="indefinite" />
    </line>
    <line x1="36" y1="15" x2="36" y2="45">
      <animate attributeName="y1" values="15;0;15" dur="1.4s" repeatCount="indefinite" />
      <animate attributeName="y2" values="45;60;45" dur="1.4s" repeatCount="indefinite" />
    </line>
    <line x1="48" y1="22" x2="48" y2="38">
      <animate attributeName="y1" values="22;10;22" dur="1.3s" repeatCount="indefinite" />
      <animate attributeName="y2" values="38;50;38" dur="1.3s" repeatCount="indefinite" />
    </line>
  </g>
</svg>
